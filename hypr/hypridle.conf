general {
    lock_cmd = chocomazapan-system-lock                         # lock screen and 1password
    before_sleep_cmd = CHOCOMAZAPAN_LOCK_ONLY=true chocomazapan-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && chocomazapan-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
# NOTE: still Omarchy's screensaver (omarchy-launch-screensaver) — deferred to
# Fase 6, pulls in per-terminal screensaver configs (alacritty/foot/ghostty/kitty).
listener {
    timeout = 150
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = chocomazapan-system-lock
    on-resume = chocomazapan-system-wake
}
