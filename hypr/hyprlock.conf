general {
    ignore_empty_input = true
}

background {
    monitor =
    reload_cmd = ~/.config/hypr/scripts/pick-lock-background.sh
    reload_time = -1
    color = rgba(30, 30, 46, 1)
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 1.05
    brightness = 0.75
    vibrancy = 0.2
}

animations {
    enabled = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1)
    font_size = 62
    font_family = JetBrainsMono Nerd Font
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "$(LC_TIME=es_MX.utf8 date +'%A, %d de %B')"
    color = rgba(205, 214, 244, 0.75)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 205
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    position = 0, 80
    halign = center
    valign = bottom

    inner_color = rgba(30, 30, 46, 0.66)
    outer_color = rgba(203, 166, 247, 1)
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(205, 214, 244, 1)

    placeholder_text = Enter Password
    check_color = rgba(148, 226, 213, 1)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = -1
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
