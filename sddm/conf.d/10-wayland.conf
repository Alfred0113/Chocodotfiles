# SDDM en modo Wayland con Hyprland como compositor del greeter.
# El default de SDDM es DisplayServer=x11, que ejecuta /usr/bin/X — y Xorg
# NO se instala en este setup, así que sin este archivo el greeter arranca,
# no encuentra el servidor X y la pantalla se queda en NEGRO tras el splash.
# (En el CachyOS del desktop este archivo ya venía; en una instalación
# limpia hay que ponerlo — install.sh lo instala.)
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
