[General]
# Fondo: lo genera chocomazapan-sddm-bg (aleatorio de ~/Imagenes/Wallpapers,
# ya recortado + desenfocado + oscurecido). Si no existe, se usa fallbackColor.
background=backgrounds/current.jpg
fallbackColor=#1e1e2e

# Fuente y colores -- catppuccin mocha, iguales a hyprlock.conf
font=JetBrainsMono Nerd Font
textColor=#cdd6f4
accentColor=#cba6f7
fieldColor=#1e1e2e
checkColor=#94e2d5
failColor=#f38ba8

# Tamanos (px) -- posiciones relativas al centro, como hyprlock
clockSize=62
dateSize=18
fieldWidth=300
fieldHeight=50
