# Login sin display manager pesado: greetd hace el login por PAM directo (sin
# getty, sin shell, sin MOTD) -> nada de texto en consola entre el splash de
# Plymouth y hyprlock.
#
# install.sh copia esto a /etc/greetd/config.toml

[terminal]
vt = 1
# No hacer chvt: Plymouth ya dejo su splash en el vt1 (--retain-splash), un
# switch lo repintaria a consola. greetd corre la sesion en vt1 sin cambiar de
# VT, asi el splash se mantiene hasta que Hyprland pinta.
switch = false

# Fallback. Si el autologin de abajo falla, o al cerrar sesion, sale este prompt
# 'login:' de texto (agreety). Tras entrar arranca Hyprland. NO hay crash-loop:
# si Hyprland revienta, greetd vuelve aqui, no lo relanza en bucle.
[default_session]
command = "agreety --cmd 'uwsm start -g -1 -e -D Hyprland hyprland.desktop'"
user = "greeter"

# Autologin al arrancar (una sola vez): lanza Hyprland como alfredo sin pedir
# contrasena a nivel login. La contrasena se escribe en hyprlock, que arranca
# como primer exec-once (hypr/core/autostart.lua).
[initial_session]
command = "uwsm start -g -1 -e -D Hyprland hyprland.desktop"
user = "alfredo"
