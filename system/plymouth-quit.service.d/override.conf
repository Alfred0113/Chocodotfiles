# plymouthd SI sale aqui (libera el DRM, sin esto Hyprland no arranca), pero
# --retain-splash deja el ultimo frame del splash en el framebuffer, asi el
# hueco splash -> Hyprland muestra el logo "AlfredPC" congelado en vez de negro.
#
# NO enmascarar plymouth-quit.service: si plymouthd no sale, se queda de DRM
# master y Hyprland revienta con "CBackend::create() failed!" (probado y
# revertido, ver README).
#
# install.sh copia esto a /etc/systemd/system/plymouth-quit.service.d/override.conf
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
