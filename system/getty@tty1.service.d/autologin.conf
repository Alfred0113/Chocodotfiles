# Autologin de tty1: entra directo como 'alfredo' sin pedir contrasena a nivel
# consola. La sesion grafica la arranca fish (fish/conf.d/chocomazapan-login.fish)
# y Hyprland levanta hyprlock de inmediato, asi que la contrasena se pide ahi.
#
# El ExecStart replica el de getty@.service (--noreset --noclear - $TERM) y solo
# le agrega --autologin. install.sh copia este archivo a
#   /etc/systemd/system/getty@tty1.service.d/autologin.conf
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin alfredo --noreset --noclear - $TERM
